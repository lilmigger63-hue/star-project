plugins { id 'fabric-loom' version '1.14.10' }
group='dk.starswordmaster'
repositories {
 mavenCentral()
 maven { url 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
loom {
 splitEnvironmentSourceSets()
 mods { starswordmaster { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
 minecraft 'com.mojang:minecraft:1.21.10'
 mappings 'net.fabricmc:yarn:1.21.10+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.138.4+1.21.10'
 // Compile against the existing required runtime mods; do not bundle or add duplicate run/mods jars.
 modCompileOnly('maven.modrinth:player-animation-library:p8nawkdm') { transitive=false }
 modCompileOnly('maven.modrinth:better-combat:qaOWa2t6') { transitive=false }
}
processResources { inputs.property 'version',project.version; filesMatching('fabric.mod.json'){ expand version:project.version } }
java { withSourcesJar(); sourceCompatibility=JavaVersion.VERSION_21; targetCompatibility=JavaVersion.VERSION_21 }
tasks.withType(JavaCompile).configureEach { options.release=21 }
tasks.register('progressionTest',JavaExec) { dependsOn testClasses; classpath=sourceSets.test.runtimeClasspath; mainClass='dk.starswordmaster.progression.ProgressionTest' }
check.dependsOn progressionTest
dependencies { testImplementation 'junit:junit:4.13.2' }
test { useJUnit() }
sourceSets {
 smoke {
  compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
 }
}
loom {
 mods { starsmoke { sourceSet sourceSets.smoke } }
 runs {
  smokeClient { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StarSmoke' }
  smokeServer { server(); source sourceSets.smoke; runDir 'run' }
 }
}
tasks.register('smokeJar',Jar) { dependsOn smokeClasses; archiveClassifier='smoke'; from sourceSets.smoke.output }
tasks.register('remapSmokeJar',net.fabricmc.loom.task.RemapJarTask) { dependsOn smokeJar; inputFile=tasks.smokeJar.archiveFile; archiveClassifier='smoke-remapped'; addNestedDependencies=false }
loom.runs.smokeClient.vmArg '-Dstarsmoke.port=25566'
loom.runs {
 smokeSingleplayer { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StarSmoke'; vmArg '-Dstarsmoke.singleplayer=true' }
}
loom.runs {
 smokeSwordV3 { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StarSmoke'; vmArg '-Dstarsmoke.singleplayer=true'; vmArg '-Dstarsmoke.world=StarSmokeSP-v0.3-sword' }
 smokeMagicV3 { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StarSmoke'; vmArg '-Dstarsmoke.singleplayer=true'; vmArg '-Dstarsmoke.magic=true'; vmArg '-Dstarsmoke.world=StarSmokeSP-v0.3-magic' }
}
loom.runs {
 smokeStatus { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StatusSmoke'; vmArg '-Dstarsmoke.status=true' }
 smokeHud { client(); source sourceSets.smoke; runDir 'run'; programArg '--username'; programArg 'StatusSmoke'; vmArg '-Dstarsmoke.hud=true' }
 smokePointsServer { server(); source sourceSets.smoke; runDir 'run/points-server'; vmArg '-Dstarsmoke.points=true'; vmArg '-Dstarsmoke.points.reset=true' }
 smokePointsA { client(); source sourceSets.smoke; runDir 'run/points-a'; programArg '--username'; programArg 'PointsSmokeA'; vmArg '-Dstarsmoke.points=true'; vmArg '-Dstarsmoke.points.role=A' }
 smokePointsB { client(); source sourceSets.smoke; runDir 'run/points-b'; programArg '--username'; programArg 'PointsSmokeB'; vmArg '-Dstarsmoke.points=true'; vmArg '-Dstarsmoke.points.role=B' }
}

loom.runs {
 smokeEffectsServer { server(); source sourceSets.smoke; runDir 'run/effects-server'; vmArg '-Dstarsmoke.effects=true'; vmArg '-Dstarsmoke.effects.reset=true' }
 smokeEffectsA { client(); source sourceSets.smoke; runDir 'run/effects-a'; programArg '--username'; programArg 'PointsSmokeA'; vmArg '-Dstarsmoke.effects=true'; vmArg '-Dstarsmoke.effects.role=A' }
 smokeEffectsB { client(); source sourceSets.smoke; runDir 'run/effects-b'; programArg '--username'; programArg 'PointsSmokeB'; vmArg '-Dstarsmoke.effects=true'; vmArg '-Dstarsmoke.effects.role=B' }
 smokeEffectsSingleplayer { client(); source sourceSets.smoke; runDir 'run/effects-sp'; programArg '--username'; programArg 'PointsSmokeA'; vmArg '-Dstarsmoke.effects=true'; vmArg '-Dstarsmoke.effects.singleplayer=true' }
}

loom.runs {
 smokeResourcesServer { server(); source sourceSets.smoke; runDir 'run/resources-server'; vmArg '-Dstarsmoke.resources=true'; vmArg '-Dstarsmoke.resources.reset=true' }
 smokeResourcesA { client(); source sourceSets.smoke; runDir 'run/resources-a'; programArg '--username'; programArg 'ResourceSmokeA'; vmArg '-Dstarsmoke.resources=true'; vmArg '-Dstarsmoke.resources.role=A' }
 smokeResourcesB { client(); source sourceSets.smoke; runDir 'run/resources-b'; programArg '--username'; programArg 'ResourceSmokeB'; vmArg '-Dstarsmoke.resources=true'; vmArg '-Dstarsmoke.resources.role=B' }
 smokeResourcesSingleplayer { client(); source sourceSets.smoke; runDir 'run/resources-sp'; programArg '--username'; programArg 'ResourceSmokeA'; vmArg '-Dstarsmoke.resources=true'; vmArg '-Dstarsmoke.resources.singleplayer=true' }
}

loom.runs {
 smokeAnimationsServer { server(); source sourceSets.smoke; runDir 'run/animations-server'; vmArg '-Dstarsmoke.animations=true' }
 smokeAnimationsA { client(); source sourceSets.smoke; runDir 'run/animations-a'; programArg '--username'; programArg 'AnimationSmokeA'; vmArg '-Dstarsmoke.animations=true' }
 smokeAnimationsB { client(); source sourceSets.smoke; runDir 'run/animations-b'; programArg '--username'; programArg 'AnimationSmokeB'; vmArg '-Dstarsmoke.animations=true'; vmArg '-Dstarsmoke.animations.role=B' }
 smokeAnimationsSingleplayer { client(); source sourceSets.smoke; runDir 'run/animations-sp'; programArg '--username'; programArg 'AnimationSmokeA'; vmArg '-Dstarsmoke.animations=true'; vmArg '-Dstarsmoke.animations.singleplayer=true' }
}

loom.runs {
 smokeLevelingServer { server(); source sourceSets.smoke; runDir 'run/leveling-server'; vmArg '-Dstarsmoke.leveling=true' }
 smokeLevelingA { client(); source sourceSets.smoke; runDir 'run/leveling-a'; programArg '--username'; programArg 'LevelSmokeA'; vmArg '-Dstarsmoke.leveling=true' }
 smokeLevelingB { client(); source sourceSets.smoke; runDir 'run/leveling-b'; programArg '--username'; programArg 'LevelSmokeB'; vmArg '-Dstarsmoke.leveling=true'; vmArg '-Dstarsmoke.leveling.role=B' }
 smokeLevelingSingleplayer { client(); source sourceSets.smoke; runDir 'run/leveling-sp'; programArg '--username'; programArg 'LevelSmokeA'; vmArg '-Dstarsmoke.leveling=true'; vmArg '-Dstarsmoke.leveling.singleplayer=true' }
}
